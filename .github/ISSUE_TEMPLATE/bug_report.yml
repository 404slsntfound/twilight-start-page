name: Bug report
description: 报告可以稳定复现的问题 / Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢你帮助改进暮光起始页。请勿提交个人书签或其他敏感数据。
  - type: input
    id: version
    attributes:
      label: 扩展版本 / Extension version
      placeholder: 1.5.9
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome 版本 / Chrome version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: 1. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或补充信息 / Screenshots or additional context
